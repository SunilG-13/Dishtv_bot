<title>DishTV — Professional Landing Page + AI Assistant</title>

<style>
:root {
  --orange: #ef5a1b;
  --orange2: #ff7a22;
  --ink: #1d1f23;
  --muted: #68707a;
  --surface: #ffffff;
  --soft: #f6f7f9;
  --line: #e5e7eb;
  --green: #10b981;
  --header-bg: rgba(255, 255, 255, 0.98);
  --page-bg: #ffffff;
  --card-bg: #ffffff;
  --border-color: rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.22);
}

body.dark-mode {
  --ink: #f0f3f6;
  --muted: #9aa1a9;
  --surface: #14171a;
  --soft: #1a1e24;
  --line: #2d333b;
  --header-bg: rgba(18, 21, 25, 0.96);
  --page-bg: #0d1117;
  --card-bg: #161b22;
  --border-color: rgba(255, 255, 255, 0.1);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  width: 100%;
  min-height: 100%;
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--page-bg);
  transition: background-color 0.2s ease, color 0.2s ease;
  overflow-x: hidden;
}

button, input { font: inherit; }
button { cursor: pointer; }

/* Header */
.header {
  height: 76px;
  background: var(--header-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 4vw, 54px);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.brand {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
}

.brand-logo-img {
  height: 42px;
  width: auto;
  max-width: 160px;
  object-fit: contain;
  display: block;
}

.brand-fallback-svg {
  height: 38px;
  width: auto;
  display: none;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 34px;
  flex: 1;
  padding: 0 24px;
}

.nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 600;
  transition: color 0.2s ease;
  white-space: nowrap;
}

.nav a:hover {
  color: var(--orange);
}

.nav .drop::after {
  content: " ⌄";
  font-size: 12px;
  margin-left: 2px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.toggle {
  width: 54px;
  height: 30px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--soft);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}

.toggle span {
  position: absolute;
  left: 3px;
  top: 2px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #ffffff;
  display: grid;
  place-items: center;
  color: var(--orange);
  font-size: 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

body.dark-mode .toggle span {
  transform: translateX(24px);
  background: var(--orange);
  color: #ffffff;
}

/* Hero Section */
.hero {
  height: calc(100vh - 76px);
  min-height: 480px;
  max-height: 780px;
  position: relative;
  overflow: hidden;
  background: #11141a;
}

.hero:hover .hero-bg {
  transform: scale(1.008);
}

.hero-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.01) 60%);
  pointer-events: none;
}

.slide-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 3;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: rgba(30, 30, 30, 0.45);
  color: #ffffff;
  font-size: 30px;
  line-height: 1;
  display: grid;
  place-items: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background 0.2s, transform 0.2s;
}

.slide-btn:hover {
  background: rgba(239, 90, 27, 0.9);
  transform: translateY(-50%) scale(1.05);
}

.slide-btn.left { left: 20px; }
.slide-btn.right { right: 20px; }

.dots {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 3;
}

.dots i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.dots i.active {

<script>
const assistant = document.getElementById('assistant');
const assistantShell = document.getElementById('assistantShell');
const hint = document.getElementById('hint');
const body = document.getElementById('body');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const micBtn = document.getElementById('micBtn');

// Multilingual Voice & Text Language Configuration
const VOICE_LANGS = {
  'auto': { code: 'auto', bcp47: 'en-IN', name: 'Auto Detect', native: 'Auto', badge: 'AUTO', placeholder: 'Ask your question in any language...' },
  'en':   { code: 'en',   bcp47: 'en-IN', name: 'English',     native: 'English', badge: 'EN',   placeholder: 'Ask in English or click mic to speak...' },
  'hi':   { code: 'hi',   bcp47: 'hi-IN', name: 'Hindi',       native: 'हिन्दी',  badge: 'HI',   placeholder: 'हिन्दी में बोलें या टाइप करें...' },
  'te':   { code: 'te',   bcp47: 'te-IN', name: 'Telugu',      native: 'తెలుగు',  badge: 'TE',   placeholder: 'తెలుగులో మాట్లాడండి లేదా టైప్ చేయండి...' },
  'ta':   { code: 'ta',   bcp47: 'ta-IN', name: 'Tamil',       native: 'தமிழ்',   badge: 'TA',   placeholder: 'தமிழில் பேசுங்கள் அல்லது தட்டச்சு செய்யுங்கள்...' },
  'kn':   { code: 'kn',   bcp47: 'kn-IN', name: 'Kannada',     native: 'ಕನ್ನಡ',   badge: 'KN',   placeholder: 'ಕನ್ನಡದಲ್ಲಿ ಮಾತನಾಡಿ ಅಥವಾ ಟೈಪ್ ಮಾಡಿ...' },
  'gu':   { code: 'gu',   bcp47: 'gu-IN', name: 'Gujarati',    native: 'ગુજરાતી', badge: 'GU',   placeholder: 'ગુજરાતીમાં બોલો અથવા લખો...' }
};

let selectedVoiceLang = 'auto';

function setLanguage(langCode) {
  if (!VOICE_LANGS[langCode]) return;
  selectedVoiceLang = langCode;
  
  // Update chips UI
  document.querySelectorAll('.lang-chip').forEach(chip => {
    chip.classList.toggle('active', chip.getAttribute('data-lang') === langCode);
  });
  
  // Update badge & input placeholder
  const cfg = VOICE_LANGS[langCode];
  const micBadge = document.getElementById('micBadge');
  if (micBadge) micBadge.textContent = cfg.badge;
  if (input) input.placeholder = cfg.placeholder;
  
  // If voice recording is actively in progress, restart with the newly selected language
  if (isRecordingActive) {
    stopVoiceRecording();
    setTimeout(() => { toggleSpeech(); }, 200);
  }
}

// Language detection from script characters
function detectLang(text) {
  const kn = (text.match(/[\u0C80-\u0CFF]/g) || []).length;
  const te = (text.match(/[\u0C00-\u0C7F]/g) || []).length;
  const ta = (text.match(/[\u0B80-\u0BFF]/g) || []).length;
  const gu = (text.match(/[\u0A80-\u0AFF]/g) || []).length;
  const hi = (text.match(/[\u0900-\u097F]/g) || []).length;
  
  const counts = [
    { l: 'kn', speech: 'kn-IN', name: 'ಕನ್ನಡ', c: kn },
    { l: 'te', speech: 'te-IN', name: 'తెలుగు', c: te },
    { l: 'ta', speech: 'ta-IN', name: 'தமிழ்', c: ta },
    { l: 'gu', speech: 'gu-IN', name: 'ગુજરાતી', c: gu },
    { l: 'hi', speech: 'hi-IN', name: 'हिन्दी', c: hi }
  ];
  counts.sort((a, b) => b.c - a.c);
  if (counts[0].c > 0) return counts[0];
  return { l: 'en', speech: 'en-IN', name: 'English', c: 0 };
}

function toggleAssistant() {
  const open = assistant.classList.toggle('open');
  assistantShell.classList.toggle('is-open', open);
  if (open) {
    input.focus();
    body.scrollTop = body.scrollHeight;
  }
}

// Parse markdown lines, numbered lists, bullets, and bold tags into clean HTML
function formatMarkdownToHtml(rawText, isStreaming = false) {
  let text = rawText || '';
  // If streaming and odd count of **, auto-close bold for clean live preview
  if (isStreaming && (text.split('**').length - 1) % 2 !== 0) {
    text = text + '**';
  }
  
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let html = '';
  let inList = false;
  let isNumbered = false;
  
  lines.forEach(line => {
    // Check if line is a numbered item or bullet
    const isNum = /^\d+[\.\)]\s/.test(line);
    const isBullet = /^(?:[\•\-\+]|\*(?!\*))\s/.test(line);
    
    if (isNum || isBullet) {
      if (!inList) {
        inList = true;
        isNumbered = isNum;
        html += isNumbered 
          ? '<ol style="margin: 6px 0 10px 0; padding-left: 20px; line-height: 1.6;">'
          : '<ul style="margin: 6px 0 10px 0; padding-left: 20px; line-height: 1.6;">';
      }
      // Strip leading number or single bullet only — NEVER touch bold '**'
      let clean = line.replace(/^\d+[\.\)]\s*/, '')
                      .replace(/^(?:[\•\-\+]|\*(?!\*))+\s*/, '')
                      .trim();
      clean = formatInline(clean);
      html += `<li style="margin-bottom: 6px;">${clean}</li>`;
    } else {
      if (inList) {
        inList = false;
        html += isNumbered ? '</ol>' : '</ul>';
      }
      html += `<p style="margin-bottom: 8px; line-height: 1.55;">${formatInline(line)}</p>`;
    }
  });
  
  if (inList) html += isNumbered ? '</ol>' : '</ul>';
  return html;
}

// Clean, Direct, Professional Assistant Message Formatter with Step-by-Step Chat Streaming
function addAssistantResponse(rawText, langCode, audioUrl, stream = true) {
  const card = document.createElement('div');
  card.className = 'msg-ai';
  
  const textEl = document.createElement('div');
  textEl.className = 'msg-ai-text';
  card.appendChild(textEl);
  
  // Single Instance Audio TTS Button
  const ttsBtn = document.createElement('button');
  ttsBtn.className = 'ai-tts-btn';
  ttsBtn.setAttribute('title', 'Listen to response');
  ttsBtn.setAttribute('aria-label', 'Listen');
  ttsBtn.innerHTML = `
    <svg class="tts-speaker-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <span class="tts-label">Listen</span>
  `;
  ttsBtn.onclick = () => playAudio(rawText, langCode, audioUrl, ttsBtn);
  
  body.insertBefore(card, typing);
  body.scrollTop = body.scrollHeight;

  // If streaming is disabled or text is extremely short, render immediately
  if (!stream || !rawText || rawText.length < 20) {
    textEl.innerHTML = formatMarkdownToHtml(rawText, false);
    card.appendChild(ttsBtn);
    body.scrollTop = body.scrollHeight;
    return;
  }

  // Tokenize response into words and punctuation for smooth step-by-step chat streaming
  const tokens = rawText.match(/(\n+|\S+\s*)/g) || [rawText];
  let tokenIdx = 0;
  let currentTokens = [];
  let isDone = false;

  function finishStream() {
    if (isDone) return;
    isDone = true;
    textEl.innerHTML = formatMarkdownToHtml(rawText, false);
    if (!card.contains(ttsBtn)) card.appendChild(ttsBtn);
    body.scrollTop = body.scrollHeight;
  }

  // Allow clicking on the message to instantly finish streaming if desired
  card.style.cursor = 'pointer';
  card.title = 'Click to show full response';
  card.onclick = () => {
    finishStream();
    card.style.cursor = 'default';
    card.removeAttribute('title');
  };

  function streamStep() {
    if (isDone) return;
    if (tokenIdx < tokens.length) {
      currentTokens.push(tokens[tokenIdx++]);
      const partial = currentTokens.join('');
      textEl.innerHTML = formatMarkdownToHtml(partial, true) + '<span class="stream-cursor"></span>';
      body.scrollTop = body.scrollHeight;
      
      const lastTok = tokens[tokenIdx - 1] || '';
      let delay = 22;
      if (lastTok.includes('\n')) delay = 60;
      else if (/[.,:;!?]$/.test(lastTok.trim())) delay = 40;
      
      setTimeout(streamStep, delay);
    } else {
      finishStream();
      card.style.cursor = 'default';
      card.removeAttribute('title');
    }
  }

  // Start step-by-step chat stream
  streamStep();
}

function formatInline(text) {
  if (!text) return '';
  
  // 0. Remove footnote/disclaimer asterisks from prices and durations (e.g. ₹1,440* -> ₹1,440, 1 Year** -> 1 Year)
  text = text.replace(/(₹\s*[\d,]+(?:\.\d+)?)\*+/g, '$1');
  text = text.replace(/(\b\d+\s+(?:Year|Month|Day|Hour)s?)\*+/gi, '$1');
  text = text.replace(/(\b[\w\u0900-\u0D7F]+)\*(?!\*|\w)/g, '$1');

  // 1. Repair unbalanced asterisks if odd count
  if ((text.split('**').length - 1) % 2 !== 0) {
    // Repair '*Word**' -> '**Word**'
    text = text.replace(/(?:^|(?<=\s))\*([^* \n]+)\*\*(?=\s|[-—:.,]|$)/g, '**$1**');
    // If still odd, repair 'Word** —' -> '**Word** —'
    if ((text.split('**').length - 1) % 2 !== 0) {
      text = text.replace(/(?:^|(?<=\s))([A-Za-z\u0900-\u0D7F ]+?)\*\*(?=\s*[-—:])/g, '**$1**');
    }
  }

  // 2. Bold tags: **text** -> <strong class="bot-bold">text</strong>
  let res = text.replace(/\*\*(.*?)\*\*/g, '<strong class="bot-bold">$1</strong>');
  
  // 3. Official DishTV helpline numbers -> interactive badge link (matches entire number so no trailing digits like 7 are left stranded)
  res = res.replace(/(\+?91[\s-]?[6-9][\d\s-]{8,12}\d|\b1800[\s-]?\d{3}[\s-]?(?:\d{3,4}|[xX]{4})\b|\b95017[\s-]?95017\b)/g, (match) => {
    const rawNumber = match.replace(/[\s-]/g, '');
    return `<a href="tel:${rawNumber}" class="bot-phone-link" title="Call ${match}"><i class="fas fa-phone-alt"></i> ${match}</a>`;
  });

  // 4. Highlight Indian Rupees amounts (e.g. ₹200, ₹154, ₹501)
  res = res.replace(/(₹\s?\d+(?:,\d+)*(?:\.\d+)?)/g, '<span class="bot-price">$1</span>');

  // 5. Clean clickable URLs
  res = res.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" class="bot-link">$1</a>');
  
  return res;
}

// Single Instance Audio Player (Never plays twice)
let currentAudio = null;
let isAudioPlaying = false;

function setTtsBtnState(btn, state) {
  if (!btn) return;
  const label = btn.querySelector('.tts-label') || btn.querySelector('span:last-child');
  if (state === 'playing') {
    btn.classList.add('playing');
    if (label) label.textContent = 'Playing...';
  } else {
    btn.classList.remove('playing');
    if (label) label.textContent = 'Listen';
  }
}

function playAudio(text, langCode, audioUrl, btn) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  
  if (isAudioPlaying && btn.classList.contains('playing')) {
    document.querySelectorAll('.ai-tts-btn').forEach(b => setTtsBtnState(b, 'idle'));
    isAudioPlaying = false;
    return;
  }
  
  document.querySelectorAll('.ai-tts-btn').forEach(b => setTtsBtnState(b, 'idle'));
  
  setTtsBtnState(btn, 'playing');
  isAudioPlaying = true;
  
  let fallbackInvoked = false;
  const triggerFallback = () => {
    if (fallbackInvoked) return;
    fallbackInvoked = true;
    fallbackSpeech(text, langCode, btn);
  };
  
  if (audioUrl) {
    const fullUrl = (window.location.protocol === 'file:' && audioUrl.startsWith('/')) 
      ? 'http://127.0.0.1:8000' + audioUrl 
      : audioUrl;
    currentAudio = new Audio(fullUrl);
    currentAudio.onended = () => {
      setTtsBtnState(btn, 'idle');
      currentAudio = null;
      isAudioPlaying = false;
    };
    currentAudio.onerror = () => {
      triggerFallback();
    };
    currentAudio.play().catch(() => {
      triggerFallback();
    });
  } else {
    triggerFallback();
  }
}

function fallbackSpeech(text, langCode, btn) {
  if (!('speechSynthesis' in window)) {
    setTtsBtnState(btn, 'idle');
    isAudioPlaying = false;
    return;
  }
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]*>/g, '').replace(/[*_#`~>]/g, '');
  const utt = new SpeechSynthesisUtterance(clean.substring(0, 300));
  
  const bcpMap = {
    'en': 'en-IN', 'hi': 'hi-IN', 'te': 'te-IN',
    'ta': 'ta-IN', 'kn': 'kn-IN', 'gu': 'gu-IN'
  };
  utt.lang = bcpMap[langCode] || langCode || 'en-IN';
  utt.rate = 1.0;
  utt.onend = () => {
    setTtsBtnState(btn, 'idle');
    currentAudio = null;
    isAudioPlaying = false;
  };
  utt.onerror = () => {
    setTtsBtnState(btn, 'idle');
    currentAudio = null;
    isAudioPlaying = false;
  };
  window.speechSynthesis.speak(utt);
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  
  const detected = detectLang(q);
  // Prioritize user selected language if not 'auto'
  const targetLang = (selectedVoiceLang !== 'auto') ? selectedVoiceLang : detected.l;
  
  addUserMessage(q);
  input.value = '';
  typing.style.display = 'block';
  body.scrollTop = body.scrollHeight;
  
  const apiUrl = (window.location.protocol === 'file:') ? 'http://127.0.0.1:8000/api/chat' : '/api/chat';
  
  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, message: q, language: targetLang })
    });
    
    if (res.ok) {
      const data = await res.json();
      typing.style.display = 'none';
      const ans = data.answer || data.response || getShortLocalAnswer(q);
      const respLang = data.language || targetLang;
      addAssistantResponse(ans, respLang, data.audio_url);
      return;
    }
  } catch (e) {
    // Backend offline or timeout -> use short local answer
  }
  
  setTimeout(() => {
    typing.style.display = 'none';
    const localAns = getShortLocalAnswer(q);
    addAssistantResponse(localAns, targetLang, null);
  }, 350);
}

// Multilingual Speech Recognition (Web Speech API Primary with Auto-Send on Silence + Fallback)
let speechRec = null;
let speechSilenceTimer = null;
let isRecordingActive = false;
let userSpokeInSession = false;
let mediaRecorder = null;
let audioChunks = [];

function toggleSpeech() {
  if (isRecordingActive) {
    stopVoiceRecording();
    return;
  }
  startSpeechListening();
}

function stopVoiceRecording() {
  isRecordingActive = false;
  clearTimeout(speechSilenceTimer);
  
  if (micBtn) micBtn.classList.remove('recording', 'speaking');
  if (input) {
    input.classList.remove('listening');
    if (!input.value.trim()) {
      const cfg = VOICE_LANGS[selectedVoiceLang];
      input.placeholder = cfg ? cfg.placeholder : 'Ask your question...';
    }
  }
  
  if (speechRec) {
    try { speechRec.stop(); } catch(e){}
    speechRec = null;
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    try { mediaRecorder.stop(); } catch(e){}
  }
}

function startSpeechListening() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  // Resolve target language
  let targetBcp47 = 'en-IN';
  let targetLangCode = selectedVoiceLang;
  if (selectedVoiceLang !== 'auto') {
    targetBcp47 = VOICE_LANGS[selectedVoiceLang].bcp47;
  } else {
    targetBcp47 = 'en-IN';
  }
  
  // 1. Primary: Browser Web Speech API (Google Chrome / Edge neural multilingual engine)
  if (SpeechRec) {
    try {
      if (speechRec) {
        try { speechRec.abort(); } catch(e){}
      }
      speechRec = new SpeechRec();
      speechRec.continuous = false;
      speechRec.interimResults = true;
      speechRec.lang = targetBcp47;
      speechRec.maxAlternatives = 1;
      
      isRecordingActive = true;
      userSpokeInSession = false;
      micBtn.classList.add('recording');
      micBtn.classList.remove('speaking');
      
      // Focus input field and highlight listening state directly inside the input
      if (input) {
        input.classList.add('listening');
        input.placeholder = 'Listening... Speak now';
        input.focus();
      }
      
      speechRec.onstart = () => {
        isRecordingActive = true;
      };
      
      speechRec.onresult = (event) => {
        clearTimeout(speechSilenceTimer);
        let interimText = '';
        let finalText = '';
        
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const item = event.results[i];
          if (item.isFinal) {
            finalText += item[0].transcript;
          } else {
            interimText += item[0].transcript;
          }
        }
        
        // Live streaming: automatically write spoken words directly into the input field
        if (interimText) {
          userSpokeInSession = true;
          input.value = interimText;
          micBtn.classList.add('speaking');
          input.scrollLeft = input.scrollWidth;
        }
        
        if (finalText) {
          userSpokeInSession = true;
          const cleanFinal = finalText.trim();
          input.value = cleanFinal;
          micBtn.classList.add('speaking');
          input.scrollLeft = input.scrollWidth;
          
          // Auto-send after 1.2s silence
          speechSilenceTimer = setTimeout(() => {
            stopVoiceRecording();
            send();
          }, 1200);
        }
      };
      
      speechRec.onerror = (err) => {
        console.warn('SpeechRecognition error:', err);
        if (err.error === 'not-allowed') {
          alert('Microphone permission is required for voice input.');
          stopVoiceRecording();
        } else if (err.error === 'no-speech' && !userSpokeInSession) {
          stopVoiceRecording();
        }
      };
      
      speechRec.onend = () => {
        if (isRecordingActive && userSpokeInSession && input.value.trim()) {
          stopVoiceRecording();
          send();
        } else {
          stopVoiceRecording();
        }
      };
      
      speechRec.start();
      return;
    } catch (e) {
      console.warn('Web Speech API failed to start, using MediaRecorder fallback:', e);
    }
  }
  
  // 2. Fallback: MediaRecorder -> Whisper backend API
  startMediaRecorderFallback(targetLangCode);
}

async function startMediaRecorderFallback(targetLangCode) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Voice input is not supported in this browser.');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    isRecordingActive = true;
    micBtn.classList.add('recording');
    if (input) {
      input.classList.add('listening');
      input.placeholder = 'Listening... Speak now';
      input.focus();
    }
    
    let mimeType = '';
    if (typeof MediaRecorder !== 'undefined') {
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
      else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
    }
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };
    
    mediaRecorder.onstop = async () => {
      isRecordingActive = false;
      micBtn.classList.remove('recording', 'speaking');
      stream.getTracks().forEach(t => t.stop());
      
      if (audioChunks.length === 0) {
        if (input) {
          input.classList.remove('listening');
          const cfg = VOICE_LANGS[selectedVoiceLang];
          input.placeholder = cfg ? cfg.placeholder : 'Ask your question...';
        }
        return;
      }
      
      input.placeholder = 'Understanding voice...';
      const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
      const formData = new FormData();
      formData.append('file', audioBlob, 'voice_query.webm');
      if (targetLangCode && targetLangCode !== 'auto') {
        formData.append('lang', targetLangCode);
      }
      
      const langParam = (targetLangCode && targetLangCode !== 'auto') ? `?lang=${targetLangCode}` : '';
      const transcribeUrl = (window.location.protocol === 'file:')
        ? `http://127.0.0.1:8000/api/voice/transcribe${langParam}`
        : `/api/voice/transcribe${langParam}`;
      
      try {
        const res = await fetch(transcribeUrl, { method: 'POST', body: formData });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.text && data.text.trim()) {
            input.value = data.text.trim();
            if (input) input.classList.remove('listening');
            send();
            return;
          }
        }
      } catch (err) {
        console.warn('Whisper fallback error:', err);
      }
      if (input) {
        input.classList.remove('listening');
        const cfg = VOICE_LANGS[selectedVoiceLang];
        input.placeholder = cfg ? cfg.placeholder : 'Ask your question...';
      }
    };
    
    mediaRecorder.start();
  } catch (err) {
    console.warn('Microphone error:', err);
    stopVoiceRecording();
  }
}

// Carousel controls
let currentSlide = 0;
const totalSlides = 4;
function setSlide(index) {
  currentSlide = index;
  const dots = document.querySelectorAll('#dotsContainer i');
  dots.forEach((d, i) => d.classList.toggle('active', i === index));
}
function nextSlide() {
  setSlide((currentSlide + 1) % totalSlides);
}
function prevSlide() {
  setSlide((currentSlide - 1 + totalSlides) % totalSlides);
}
